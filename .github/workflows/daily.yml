name: Daily Morning Radio
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'site/index.html'
      - '.github/workflows/daily.yml'
  workflow_dispatch:
  schedule:
    # JST 06:40 = UTC 21:40 on previous day.
    - cron: '40 21 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: radio-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public episode
        run: python scripts/generate.py
      - name: Install free TTS generator
        run: python -m pip install edge-tts trafilatura
      - name: Install audio mixer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate actual Japanese MP3
        run: python scripts/audio.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
